name: Security checks

on:
  pull_request:
    branches: [main, vulnerable]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --no-git --source=/repo --verbose --redact

  sca:
    name: Dependencies (SCA - Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
      - name: Snyk Security Scan
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  sast:
    name: Code Analysis (SAST - SonarCloud / SonarQube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history is required by Sonar for accurate analysis
      - name: SonarCloud / SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Comment SonarQube findings on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          sleep 5
          node -e '
            const fs = require("fs");
            const cp = require("child_process");

            const prNumber = process.env.PR_NUMBER;
            const projectKey = "AhmedAmrNabil_presentation-law";
            const repo = process.env.REPO;

            async function run() {
              const url = `https://sonarcloud.io/api/issues/search?projects=${projectKey}&pullRequest=${prNumber}&resolved=false`;
              const res = await fetch(url, {
                headers: process.env.SONAR_TOKEN ? { Authorization: `Bearer ${process.env.SONAR_TOKEN}` } : {}
              });
              if (!res.ok) {
                console.log("Could not fetch SonarCloud issues:", res.status, res.statusText);
                return;
              }
              const data = await res.json();
              const issues = data.issues || [];

              let md = "<!-- sonarcloud-report -->\n## 🔍 SonarQube / SonarCloud Code Analysis Report\n\n";

              if (issues.length === 0) {
                md += "✅ **Quality Gate Passed!** No open vulnerabilities or code smells detected on this Pull Request.\n";
              } else {
                const vulnCount = issues.filter(i => i.type === "VULNERABILITY").length;
                const bugCount = issues.filter(i => i.type === "BUG").length;
                const smellCount = issues.filter(i => i.type === "CODE_SMELL").length;

                md += `⚠️ **Found ${issues.length} issue(s)** (${vulnCount} Vulnerabilities, ${bugCount} Bugs, ${smellCount} Code Smells)\n\n`;
                md += "| Severity | Type | Location | Issue Message |\n";
                md += "| :--- | :--- | :--- | :--- |\n";

                for (const i of issues) {
                  const file = i.component.split(":").pop();
                  const loc = i.line ? `\`${file}:${i.line}\`` : `\`${file}\``;
                  const sevIcon = i.severity === "BLOCKER" ? "🛑 **BLOCKER**" :
                                  i.severity === "CRITICAL" ? "🔴 **CRITICAL**" :
                                  i.severity === "MAJOR" ? "🟠 **MAJOR**" :
                                  i.severity === "MINOR" ? "🟡 **MINOR**" : "ℹ️ **INFO**";
                  md += `| ${sevIcon} | \`${i.type}\` | ${loc} | ${i.message} |\n`;
                }
              }

              md += `\n> 🔗 [View full interactive report on SonarCloud](https://sonarcloud.io/project/issues?id=${projectKey}&pullRequest=${prNumber}&resolved=false)\n`;
              fs.writeFileSync("sonar_report.md", md);

              try {
                const comments = JSON.parse(cp.execSync(`gh pr view ${prNumber} --json comments`, { encoding: "utf8" })).comments;
                const existing = comments.find(c => c.body && c.body.includes("<!-- sonarcloud-report -->"));
                if (existing) {
                  cp.execSync(`gh api repos/${repo}/issues/comments/${existing.id} -X PATCH -F body=@sonar_report.md`);
                  console.log("Updated existing SonarQube PR comment.");
                } else {
                  cp.execSync(`gh pr comment ${prNumber} --body-file=sonar_report.md`);
                  console.log("Posted new SonarQube PR comment.");
                }
              } catch (e) {
                console.error("Failed to post/update comment via gh CLI:", e.message);
              }
            }

            run();
          '

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:latest hadolint -t warning - < Dockerfile

  container-and-k8s:
    name: Image + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan Dockerfile and k8s manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dast:
    name: Runtime (DAST - OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and start app
        run: |
          docker build -t demo-app .
          docker run -d --name app --network host demo-app
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break || sleep 1; done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: '-m 1 -T 1'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: true
