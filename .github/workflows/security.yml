name: Security checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --no-git --source=/repo --verbose --redact

  sca:
    name: Dependencies (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sast:
    name: Code (SAST - Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/javascript --config p/expressjs --error --metrics=off /src/app.js

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:latest hadolint -t warning - < Dockerfile

  container-scan:
    name: Image + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfile and k8s manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dast:
    name: Runtime (DAST - OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start app
        run: |
          docker build -t demo-app .
          docker run -d --name app --network host demo-app
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break || sleep 1; done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: '-m 1 -T 1'
          allow_issue_writing: false
          fail_action: false
