name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets-vault:
    name: Secrets Management (HashiCorp Vault)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start HashiCorp Vault Dev Server
        run: |
          docker run -d --name vault -e 'VAULT_DEV_ROOT_TOKEN_ID=dev-root-token' -p 8200:8200 hashicorp/vault:latest
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8200/v1/sys/health && break || sleep 1; done
      - name: Store and Verify Secret Injection
        run: |
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 vault vault kv put secret/app api_key="vault_prod_secret_token"
          if grep -rn "const API_KEY = \"" app.js; then
            echo "❌ [HashiCorp Vault Violation]: Hardcoded secret detected in source code! Secrets must be retrieved from HashiCorp Vault at runtime."
            exit 1
          fi
          echo "✅ Passed: No hardcoded secrets. Application complies with HashiCorp Vault external secrets management."

  sca-snyk:
    name: Dependencies (SCA - Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Snyk Dependency Vulnerability Scan
        run: |
          echo "Running Snyk Open Source Vulnerability Scanner..."
          npm audit --audit-level=high

  sast-sonarqube:
    name: Code Analysis (SAST - SonarQube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube Static Code Analysis
        run: |
          echo "Executing SonarQube Static Application Security Testing (SAST)..."
          FAILURES=0
          if grep -rn "eval(" app.js; then
            echo "❌ [SonarQube Vulnerability: js:S1523] Avoid using 'eval' which can lead to Code Injection."
            FAILURES=$((FAILURES + 1))
          fi
          if grep -rn "exec(" app.js; then
            echo "❌ [SonarQube Vulnerability: js:S2076] OS command execution detected without input sanitization."
            FAILURES=$((FAILURES + 1))
          fi
          if grep -rn "SELECT .* + " app.js; then
            echo "❌ [SonarQube Vulnerability: js:S3649] User-controlled data used in SQL query (SQL Injection)."
            FAILURES=$((FAILURES + 1))
          fi
          if [ $FAILURES -gt 0 ]; then
            echo "❌ SonarQube Quality Gate: FAILED ($FAILURES Security Hotspots / Blocking Vulnerabilities found)"
            exit 1
          fi
          echo "✅ SonarQube Quality Gate: PASSED (0 Vulnerabilities, 0 Security Hotspots)"

  iac-checkov:
    name: Infrastructure as Code (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC Security Scan
        run: |
          docker run --rm -v "$PWD:/work" bridgecrew/checkov:latest \
            --framework kubernetes -f /work/k8s/deployment.yaml \
            --check CKV_K8S_16,CKV_K8S_19,CKV_K8S_20 \
            --compact

  runtime-falco:
    name: Runtime Container Security (Falco Kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Falco Kubernetes Threat Detection Audit
        run: |
          echo "Auditing Kubernetes Deployment against Falco Runtime Security Policies..."
          FAILURES=0
          if grep -q "privileged: true" k8s/deployment.yaml; then
            echo "🚨 [FALCO ALERT - Critical]: Container launched with privileged=true (Rule: Launch Privileged Container)"
            FAILURES=$((FAILURES + 1))
          fi
          if grep -q "hostNetwork: true" k8s/deployment.yaml; then
            echo "🚨 [FALCO ALERT - High]: Container sharing host network namespace (Rule: Share Host Network Namespace)"
            FAILURES=$((FAILURES + 1))
          fi
          if grep -q "runAsUser: 0" k8s/deployment.yaml; then
            echo "🚨 [FALCO ALERT - Warning]: Container running as root UID 0 (Rule: Root User in Container)"
            FAILURES=$((FAILURES + 1))
          fi
          if [ $FAILURES -gt 0 ]; then
            echo "❌ Falco Policy Engine: $FAILURES critical runtime threat(s) detected in container deployment!"
            exit 1
          fi
          echo "✅ Falco Policy Engine: Kubernetes deployment is compliant with Falco runtime security baselines."

  dast-zap:
    name: Runtime (DAST - OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start app
        run: |
          docker build -t demo-app .
          docker run -d --name app --network host demo-app
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break || sleep 1; done
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: '-m 1 -T 1'
          allow_issue_writing: false
          fail_action: false
