name: Security pipeline

on:
  pull_request:
    branches: [main, vulnerable]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Stage 1: fast checks, no build needed ----------
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --no-git --source=/repo --verbose --redact

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker run --rm -i hadolint/hadolint:latest hadolint -t warning - < Dockerfile

  iac-scan:
    name: IaC config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------- Stage 2: code analysis ----------
  sca:
    name: Dependencies (Snyk)
    needs: [secrets-scan, dockerfile-lint, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
      - uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  sast:
    name: Code analysis (SonarCloud)
    needs: [secrets-scan, dockerfile-lint, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
      - name: SonarQube Quality Gate Report
        if: always() && github.event_name == 'pull_request'
        uses: phwt/sonarqube-quality-gate-action@e8842ff65b97bfa4fd4effe3ab0909f568d16e91 # v1.7.0
        with:
          sonar-project-key: AhmedAmrNabil_presentation-law
          sonar-host-url: https://sonarcloud.io
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request: ${{ github.event.pull_request.number }}

  # ---------- Stage 3: build once, scan the artifact ----------
  build:
    name: Build image
    needs: [sca, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          docker build -t demo-app:${{ github.sha }} .
          docker save demo-app:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4 # pin to a SHA like your other actions
        with:
          name: image
          path: image.tar
          retention-days: 1

  image-scan:
    name: Image CVEs (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4 # pin to a SHA
        with:
          name: image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- Stage 4: runtime test against the same image ----------
  dast:
    name: Runtime (OWASP ZAP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@v4 # pin to a SHA
        with:
          name: image
      - run: |
          docker load -i image.tar
          docker run -d --name app --network host demo-app:${{ github.sha }}
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break || sleep 1; done
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: "-m 1 -T 1"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

  # ---------- Stage 5: only when everything passed, only on main ----------
  release:
    name: Publish image
    needs: [image-scan, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4 # pin to a SHA
        with:
          name: image
      - run: |
          docker load -i image.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/demo-app
          docker tag demo-app:${{ github.sha }} $IMG:${{ github.sha }}
          docker push $IMG:${{ github.sha }}