apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: ghcr.io/ahmedamrnabil/presentation-law:latest
          ports:
            - containerPort: 3000
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
